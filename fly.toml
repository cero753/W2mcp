# Fly.io config for the anymcp hosting gateway.
# Deploy:
#   fly launch --no-deploy           # creates the app
#   fly secrets set ANYMCP_MASTER_KEY=$(openssl rand -hex 32)
#   fly secrets set DATABASE_URL="postgres://...supabase or neon..."
#   fly deploy
app = "anymcp-gateway"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0   # scale to zero when idle

[env]
  PORT = "8080"
  ANYMCP_REGISTRY = "./registry.json"
