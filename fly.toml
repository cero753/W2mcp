# Fly.io config for the w2mcp hosting gateway.
# Deploy:
#   fly launch --no-deploy           # creates the app
#   fly secrets set W2MCP_MASTER_KEY=$(openssl rand -hex 32)
#   fly secrets set DATABASE_URL="postgres://...supabase or neon..."
#   fly deploy
app = "w2mcp-gateway"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1   # DEMO DAY: keep 1 warm to avoid cold-start stall on stage (revert to 0 after)

[env]
  PORT = "8080"
  W2MCP_REGISTRY = "./registry.json"
